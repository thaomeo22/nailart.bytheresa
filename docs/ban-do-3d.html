<title>{{TEN_XUONG}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D island; title card top-left, info card right (bottom sheet on phones), step rail along the bottom */
:root{
  --sky:#e3f3ef; --sky2:#f8efe6; --ink:#3a2e40; --ink-soft:#6c5d72;
  --paper:#fffaf3; --line:#eadfd6; --claude:#7fc8ad; --claude-ink:#2f6d58;
  --owner:#ee8d79; --owner-ink:#9b3f2d; --butter:#f6dc85;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--sky2));color:var(--ink);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;
  background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font:600 13px/1 var(--body);
  color:var(--ink);white-space:nowrap;box-shadow:0 6px 14px rgba(58,46,64,.14);transition:transform .2s,border-color .2s}
.pin b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font:800 14px/1 var(--display);color:#fff;background:var(--claude-ink)}
.pin.owner b{background:var(--owner-ink)}
.pin.on{border-color:var(--ink);transform:translate(-50%,-100%) scale(1.08)}
.pin:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.card{position:fixed;background:var(--paper);border:2px solid var(--line);border-radius:22px;box-shadow:0 18px 40px rgba(58,46,64,.16)}
#title{top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:14px 18px;max-width:330px}
#title h1{margin:0;font:800 30px/1 var(--display);letter-spacing:-.5px}
#title p{margin:6px 0 10px;color:var(--ink-soft);font-size:13px;line-height:1.45}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;background:var(--claude)}
.legend i.o{background:var(--owner)}
.ctrl{display:flex;gap:8px;margin-top:12px}
button{font:600 13px/1 var(--body);color:var(--ink);background:var(--sky);border:2px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--ink-soft)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#info{top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:340px;padding:18px 20px 20px;max-height:calc(100% - 150px);overflow:auto}
#info .who{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:#dff2ea;color:var(--claude-ink)}
#info .who.owner{background:#fbe3dc;color:var(--owner-ink)}
#info h2{margin:10px 0 4px;font:800 26px/1.05 var(--display);text-wrap:balance}
#info .lead{margin:0 0 12px;color:var(--ink-soft);font-size:14px;line-height:1.5}
#info dl{margin:0;display:grid;gap:10px}
#info dt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
#info dd{margin:2px 0 0;font-size:14px;line-height:1.5}
#info .parts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#info .parts span{font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--butter)}
#rail{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:8px;justify-content:center;overflow-x:auto;scrollbar-width:none}
#rail button{display:flex;align-items:center;gap:8px;background:var(--paper);flex:none;padding:7px 12px 7px 7px}
#rail button b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;background:var(--claude-ink);font:800 13px/1 var(--display)}
#rail button.owner b{background:var(--owner-ink)}
#rail button[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
#rail .arrow{align-self:center;color:var(--ink-soft);flex:none}
.pin .count{display:grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--butter);font:800 12px/1 var(--display);color:var(--ink)}
.pin .count:empty{display:none}
.bub{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 46px));max-width:220px;padding:7px 11px;border-radius:14px;
  background:var(--paper);border:2px solid var(--line);font:500 12px/1.35 var(--body);color:var(--ink);box-shadow:0 6px 14px rgba(58,46,64,.12);text-align:center}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:var(--paper);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bub[hidden]{display:none}
#info .back{margin:-4px 0 10px;padding:6px 12px;font-size:12px}
#info h3{margin:16px 0 6px;font:800 16px/1.2 var(--display)}
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.vlist li{display:grid;gap:4px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff}
.vlist .top{display:flex;align-items:baseline;gap:8px;min-width:0}
.vlist .num{font:800 15px/1 var(--display);color:var(--ink-soft);flex:none}
.vlist .tt{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.vlist .note{font-size:12px;color:var(--ink-soft);line-height:1.4}
.vlist .note a{color:var(--claude-ink);font-weight:600}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--claude)}
.dots i.now{background:var(--owner)}
.vlist li.paused{opacity:.7}
.vlist li.paused .dots i.now{background:var(--ink-soft)}
.empty{font-size:13px;color:var(--ink-soft);line-height:1.5}
#log{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:440px;max-height:38%;display:flex;flex-direction:column;overflow:hidden}
#log header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:2px solid var(--line)}
#log h2{margin:0;font:800 16px/1 var(--display)}
#log button{padding:5px 10px;font-size:12px}
#log .rows{overflow:auto;padding:4px 0}
#log table{width:100%;border-collapse:collapse;font-size:12px}
#log td{padding:6px 14px;vertical-align:top;border-bottom:1px dashed var(--line);line-height:1.4}
#log td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
#log td:nth-child(2){white-space:nowrap;font-weight:600}
#log.closed .rows{display:none}
#live{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--ink-soft)}
#live i{width:8px;height:8px;border-radius:50%;background:var(--line)}
#live.on i{background:var(--claude)}
@media (max-width:1100px){#log{width:340px}}
@media (max-width:760px){
  #title{right:max(16px,env(safe-area-inset-right,0px));max-width:none;padding:12px 14px}
  #title h1{font-size:24px} #title p{display:none}
  #info{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-height:38%;padding:14px 16px}
  #info h2{font-size:22px} #rail{justify-content:flex-start} .pin{font-size:11px;padding-right:8px}
  #log{width:auto;right:max(16px,env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));bottom:auto;max-height:45%}
  .bub{display:none}
}
@media (prefers-reduced-motion:reduce){.pin{transition:none}}
</style>

<div id="stage"></div>
<div id="labels"></div>

<section class="card" id="title" aria-label="Giới thiệu">
  <h1>{{TEN_XUONG}}</h1>
  <p>Tiến độ thật của từng video. Chạm vào một trạm để xem việc ở đó và video nào đang nằm ở trạm đó.</p>
  <div class="legend"><span><i></i>Claude làm</span><span><i class="o"></i>Bạn làm</span></div>
  <div class="ctrl">
    <button id="play" aria-pressed="false">Tự chạy</button>
    <button id="spin" aria-pressed="false">Xoay đảo</button>
  </div>
  <div id="live"><i></i><span>Đang tải tiến độ…</span></div>
</section>

<aside class="card" id="info" aria-live="polite"></aside>
<section class="card" id="log" aria-label="Nhật ký việc">
  <header><h2>Nhật ký việc</h2><button id="logToggle" aria-expanded="true">Thu gọn</button></header>
  <div class="rows"><table><tbody id="logRows"><tr><td colspan="3" class="empty">Nhật ký sẽ hiện ở đây khi Claude làm xong từng việc.</td></tr></tbody></table></div>
</section>
<nav id="rail" aria-label="Các bước"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const STEPS = [
  {name:"Nghiên cứu", who:"claude", lead:"Tìm chủ đề đáng làm trong lĩnh vực của bạn.",
   does:"Quét các kênh mẫu bạn chọn, lọc chủ đề đúng lĩnh vực, bỏ chủ đề đã làm.",
   input:"Kênh mẫu + Content plan", output:"1 Doc ý tưởng & transcript cho cả đợt, trong 00 Kế hoạch.",
   idle:"Chờ đợt chủ đề mới"},
  {name:"Viết script", who:"claude", lead:"Rút gọn video gốc thành script khoảng 1 phút theo giọng của bạn.",
   does:"Đọc transcript bạn dán, chọn 3–4 ý mạnh nhất, kiểm tra từng nghiên cứu và con số, đánh dấu [xác nhận] ở câu chuyện cá nhân.",
   input:"Transcript trong Doc ý tưởng", output:"1 Doc script cho cả đợt, mỗi video một mục", parts:["Hook","Script ghi âm","Caption đăng"],
   idle:"Chờ transcript"},
  {name:"Bạn sửa script", who:"owner", lead:"Một lượt sửa duy nhất, ngay trên Doc script.",
   does:"Đổi chữ cho đúng giọng, xác nhận câu chuyện cá nhân, chốt Hook và Caption. Sau đó thu voice theo Script ghi âm.",
   input:"Doc script Claude viết", output:"Script chốt + file voice"},
  {name:"Up lên Drive", who:"owner", lead:"Gửi nguyên liệu cho xưởng.",
   does:"Voice và video quay vào thư mục “Video NN” của video đó. Để chia sẻ “Anyone with the link” để Claude tải được file lớn.",
   input:"Voice + video quay", output:"Nhắn Claude: “Video 03 đã up”"},
  {name:"Dựng video", who:"claude", lead:"Dựng lần lượt từng video, xong video này mới sang video khác.",
   does:"Đọc script đã sửa, nhận dạng voice, cảnh chạy theo đúng thứ tự quay. Hook hiện đủ từ 0s, đồ hoạ scrapbook, phụ đề từng cụm chữ. Kiểm tra độ dài, âm lượng −14 LUFS, khung đen.",
   input:"Script chốt + voice + video quay", output:"Video 1080×1920, dài đúng bằng voice",
   idle:"Chờ voice + video quay"},
  {name:"Final", who:"owner", lead:"Bạn xem, góp ý nếu cần, rồi tự đăng.",
   does:"Video final nằm trong thư mục Final Video, kèm Caption đăng. Góp ý (“đồ hoạ to hơn”) thì chỉ bước liên quan được chạy lại.",
   input:"Video final + caption", output:"Bài đăng TikTok / Reels / Shorts"}
];
// what the bubble above a station says when videos are waiting there
const WAITING = ["{n} chủ đề đang nghiên cứu", "{n} script đang viết", "{n} script chờ bạn sửa", "{n} video chờ bạn up", "{n} video đang dựng", "{n} video đã xong"];

const C = {cream:0xf7e9d6, side:0xeba9b9, grass:0x9fd6bb, path:0xf3dcb0, pink:0xf6b8c8, lilac:0xc9b6f2, butter:0xf6dc85,
  mint:0x9fd8c1, sky:0xa9d4f2, coral:0xee8d79, plum:0x5b4763, white:0xffffff, wood:0xd9b38c, leaf:[0x9fd8c1,0xf6b8c8,0xc9b6f2,0xb7e0a3]};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- scene ----------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe9f1ea, 38, 80);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
camera.position.set(0, 24, 31);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 16; controls.maxDistance = 46; controls.maxPolarAngle = 1.25; controls.minPolarAngle = .45;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xfff7ef, 0xb9d8cb, .5));
const sun = new THREE.DirectionalLight(0xfff4e8, .62);
sun.position.set(12, 22, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-20, right:20, top:20, bottom:-20});
scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({color:c, roughness:.85, metalness:0});
function mesh(geo, color, x=0, y=0, z=0, parent=scene){
  const m = new THREE.Mesh(geo, mat(color)); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
const G = {
  box:(w,h,d)=>new THREE.BoxGeometry(w,h,d), cyl:(rt,rb,h,s=24)=>new THREE.CylinderGeometry(rt,rb,h,s),
  cone:(r,h,s=24)=>new THREE.ConeGeometry(r,h,s), sph:(r)=>new THREE.SphereGeometry(r,24,16), tor:(r,t)=>new THREE.TorusGeometry(r,t,12,32)
};

// island
mesh(G.cyl(15.5, 14.6, 2.2, 64), C.side, 0, -1.1, 0);
mesh(G.cyl(15.6, 15.6, .35, 64), C.cream, 0, .17, 0);
mesh(G.cyl(14.2, 14.2, .2, 64), C.grass, 0, .4, 0);
// pond in the middle
mesh(G.cyl(3.2, 3.2, .12, 48), C.sky, 0, .52, 0);
mesh(G.tor(3.25, .22), C.cream, 0, .55, 0).rotation.x = Math.PI/2;

// stations around a ring
const R = 9.2, N = STEPS.length;
const angle = i => -Math.PI/2 - i * (2*Math.PI/N) + Math.PI/N;
const posOf = (i, r=R) => new THREE.Vector3(Math.cos(angle(i))*r, 0, Math.sin(angle(i))*r);

// path ring made of stepping tiles
for (let k = 0; k < 60; k++){
  const a = k/60*Math.PI*2, t = mesh(G.cyl(.55,.55,.1,16), C.path, Math.cos(a)*R, .52, Math.sin(a)*R);
  t.scale.set(1, 1, .8); t.rotation.y = -a;
}

const stations = [];
function station(i, build){
  const g = new THREE.Group(); const p = posOf(i);
  g.position.copy(p); g.position.y = .5;
  g.lookAt(0, .5, 0); g.rotateY(Math.PI);
  scene.add(g);
  mesh(G.cyl(2.3, 2.4, .3, 40), STEPS[i].who === "owner" ? 0xfde3db : 0xe2f4ec, 0, .15, 0, g);
  build(g);
  const hit = new THREE.Mesh(G.cyl(2.6, 2.6, 6, 16), new THREE.MeshBasicMaterial({visible:false}));
  hit.position.y = 3; hit.userData.step = i; g.add(hit);
  stations.push({group:g, hit, top: new THREE.Vector3(p.x, 6.4, p.z)});
}

// 1 Nghiên cứu: library tower + magnifier
station(0, g => {
  mesh(G.cyl(1.1, 1.25, 3.2), C.lilac, 0, 1.9, 0, g);
  mesh(G.cone(1.5, 1.6), C.pink, 0, 4.3, 0, g);
  for (let k=0;k<3;k++) mesh(G.box(.5,.7,.08), C.white, Math.cos(k*2.1)*1.15, 2.3, Math.sin(k*2.1)*1.15, g).lookAt(0,2.3,0);
  const mag = new THREE.Group(); mag.position.set(1.4, 2.2, .6); mag.rotation.z = -.5; g.add(mag);
  mesh(G.tor(.6, .12), C.butter, 0, 0, 0, mag);
  mesh(G.cyl(.55,.55,.04), 0xdff3fb, 0, 0, 0, mag).rotation.x = Math.PI/2;
  mesh(G.cyl(.12,.12,1.1), C.wood, 0, -1.15, 0, mag);
  g.userData.spinner = mag;
});
// 2 Viết script: house + 3 sheets (Hook / Script / Caption) + pencil
station(1, g => {
  mesh(G.box(2.2, 1.8, 1.8), C.cream, 0, 1.2, 0, g);
  const roof = mesh(G.cyl(0, 1.7, 1.2, 4), C.mint, 0, 2.7, 0, g); roof.rotation.y = Math.PI/4; roof.scale.set(1.05, 1, .95);
  mesh(G.box(.5, .8, .06), C.plum, 0, .7, .92, g);
  [C.butter, C.pink, C.lilac].forEach((c, k) => mesh(G.box(1.1, .06, 1.4), c, 1.6, .45 + k*.12, 1.1 - k*.05, g).rotation.y = .15*k);
  const pen = new THREE.Group(); pen.position.set(1.7, 1.2, 1.1); pen.rotation.z = .9; g.add(pen);
  mesh(G.cyl(.13,.13,1.4,6), C.butter, 0, 0, 0, pen); mesh(G.cone(.13,.35,6), C.wood, 0, -.87, 0, pen);
  g.userData.bobber = pen;
});
// 3 Bạn sửa script: cottage with coral roof + check sign
station(2, g => {
  mesh(G.box(2, 1.6, 1.7), C.white, 0, 1.1, 0, g);
  const roof = mesh(G.cyl(0, 1.6, 1.3, 4), C.coral, 0, 2.55, 0, g); roof.rotation.y = Math.PI/4;
  mesh(G.box(.45, .75, .06), C.wood, 0, .68, .87, g);
  mesh(G.cyl(.06,.06,1.6), C.wood, 1.5, 1.1, .6, g);
  const sign = new THREE.Group(); sign.position.set(1.5, 2.1, .6); g.add(sign);
  mesh(G.box(.9, .7, .08), C.butter, 0, 0, 0, sign);
  const ck1 = mesh(G.box(.12, .32, .1), 0x3f8f6b, -.12, -.04, .05, sign); ck1.rotation.z = .8;
  const ck2 = mesh(G.box(.12, .55, .1), 0x3f8f6b, .1, .04, .05, sign); ck2.rotation.z = -.6;
  g.userData.bobber = sign;
});
// 4 Up lên Drive: cloud + mailbox + arrow
station(3, g => {
  const cloud = new THREE.Group(); cloud.position.set(0, 3.3, 0); g.add(cloud);
  [[0,0,0,.9],[.8,-.15,0,.7],[-.8,-.15,0,.7],[.35,.35,0,.65],[-.4,.3,0,.6]].forEach(([x,y,z,r]) => mesh(G.sph(r), C.white, x, y, z, cloud));
  const tri = mesh(G.cyl(.5,.5,.12,3), C.butter, 0, 0, .85, cloud); tri.rotation.x = Math.PI/2;
  mesh(G.box(1, .8, 1.2), C.sky, -.9, .95, .4, g);
  mesh(G.cyl(.5, .5, 1.2, 16, 1, false), C.sky, -.9, 1.35, .4, g).rotation.x = Math.PI/2;
  mesh(G.cyl(.06,.06,1), C.wood, -.9, .3, .4, g);
  const arrow = new THREE.Group(); arrow.position.set(.9, 1.4, .6); g.add(arrow);
  mesh(G.cyl(.15,.15,.8,12), C.coral, 0, 0, 0, arrow); mesh(G.cone(.35,.5,12), C.coral, 0, .65, 0, arrow);
  g.userData.riser = arrow; g.userData.floater = cloud;
});
// 5 Dựng video: studio + film reel + 3 clips in order
station(4, g => {
  mesh(G.box(2.4, 2, 1.8), C.lilac, 0, 1.3, -.2, g);
  mesh(G.box(2.6, .25, 2), C.plum, 0, 2.42, -.2, g);
  const reel = new THREE.Group(); reel.position.set(0, 3.5, -.2); g.add(reel);
  mesh(G.cyl(.85,.85,.25,32), C.plum, 0, 0, 0, reel).rotation.x = Math.PI/2;
  for (let k=0;k<5;k++){ const a=k/5*Math.PI*2; mesh(G.cyl(.18,.18,.27,12), C.cream, Math.cos(a)*.48, Math.sin(a)*.48, 0, reel).rotation.x = Math.PI/2; }
  g.userData.spinner = reel; g.userData.spinAxis = "z";
  mesh(G.box(3, .12, .6), C.wood, 0, .42, 1.25, g);
  [C.pink, C.butter, C.mint].forEach((c, k) => mesh(G.box(.7, .5, .45), c, -.95 + k*.95, .74, 1.25, g));
  const clap = new THREE.Group(); clap.position.set(1.65, 1, .9); g.add(clap);
  mesh(G.box(.8, .55, .1), C.plum, 0, 0, 0, clap);
  const top = mesh(G.box(.8, .14, .1), C.white, 0, .36, 0, clap); g.userData.clap = top;
});
// 6 Final: giant phone with play button + confetti
station(5, g => {
  const phone = new THREE.Group(); phone.position.set(0, 2.3, 0); phone.rotation.x = -.12; g.add(phone);
  mesh(G.box(1.7, 3.2, .25), C.plum, 0, 0, 0, phone);
  mesh(G.box(1.5, 2.9, .05), C.pink, 0, 0, .14, phone);
  const play = mesh(G.cyl(.42,.42,.08,3), C.white, .05, 0, .2, phone); play.rotation.set(Math.PI/2, 0, -Math.PI/2);
  mesh(G.box(1.9, .3, .9), C.cream, 0, .7, .2, g);
  const conf = new THREE.Group(); g.add(conf);
  for (let k=0;k<14;k++){
    const c = mesh(G.box(.14,.14,.04), [C.butter,C.coral,C.lilac,C.mint][k%4], (Math.random()-.5)*3, 2+Math.random()*2.6, (Math.random()-.5)*1.6, conf);
    c.userData.v = .4 + Math.random()*.6;
  }
  g.userData.confetti = conf;
});

// trees
const trees = [];
for (let k=0;k<26;k++){
  const a = Math.random()*Math.PI*2, r = k < 10 ? 4.4 + Math.random()*2.3 : 11.6 + Math.random()*2.2;
  const x = Math.cos(a)*r, z = Math.sin(a)*r;
  if (stations.some(s => Math.hypot(s.group.position.x-x, s.group.position.z-z) < 3.2)) continue;
  const t = new THREE.Group(); t.position.set(x, .5, z); scene.add(t);
  const h = .6 + Math.random()*.6;
  mesh(G.cyl(.12,.16,h,8), C.wood, 0, h/2, 0, t);
  const s = .55 + Math.random()*.45;
  mesh(G.sph(s), C.leaf[k%4], 0, h + s*.8, 0, t);
  if (k % 3 === 0) mesh(G.sph(s*.7), C.leaf[(k+1)%4], s*.4, h + s*1.4, 0, t);
  trees.push(t);
}

// little workers walking the path, one carries the parcel between steps
function blob(color, hat){
  const b = new THREE.Group(); scene.add(b);
  mesh(G.sph(.42), color, 0, .55, 0, b).scale.set(1, 1.15, 1);
  mesh(G.sph(.3), C.cream, 0, 1.25, 0, b);
  mesh(G.sph(.05), C.plum, .1, 1.3, .27, b); mesh(G.sph(.05), C.plum, -.1, 1.3, .27, b);
  if (hat) mesh(G.cone(.28,.4,12), hat, 0, 1.6, 0, b);
  return b;
}
const walkers = [
  {o: blob(C.mint, C.butter), a: 0, sp: .11},
  {o: blob(C.mint, C.lilac), a: 2.2, sp: .09},
  {o: blob(C.coral, C.pink), a: 4.1, sp: .07}
];
const courier = blob(C.mint, C.coral);
const parcel = mesh(G.box(.5,.4,.5), C.butter, 0, 1.95, 0, courier);
mesh(G.box(.52,.08,.12), C.coral, 0, 2.17, 0, courier);

// ---------- labels ----------
const labels = document.getElementById("labels"), rail = document.getElementById("rail"), info = document.getElementById("info");
const pins = STEPS.map((s, i) => {
  const el = document.createElement("button");
  el.className = "pin" + (s.who === "owner" ? " owner" : "");
  el.innerHTML = `<b>${i+1}</b>${s.name}<span class="count"></span>`;
  el.setAttribute("aria-label", `Bước ${i+1}: ${s.name}`);
  el.addEventListener("click", () => select(i, true));
  labels.appendChild(el); return el;
});
const bubbles = STEPS.map(() => {
  const el = document.createElement("div"); el.className = "bub"; el.hidden = true;
  labels.appendChild(el); return el;
});

// ---------- live progress (db) ----------
let VIDEOS = [], LOG = [], view = "overview";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https:\/\//.test(u || "") ? u : "";
const atStage = i => VIDEOS.filter(v => v.stage === i && v.state !== "paused" && v.state !== "done");
function videoItem(v){
  const dots = STEPS.map((_, k) => `<i class="${k < v.stage || v.state === "done" ? "done" : k === v.stage ? "now" : ""}"></i>`).join("");
  const links = [["scriptUrl","Script"],["folderUrl","Thư mục"],["finalUrl","Video final"]]
    .filter(([k]) => safeUrl(v[k])).map(([k, l]) => `<a href="${esc(safeUrl(v[k]))}" target="_blank" rel="noopener">${l}</a>`).join(" · ");
  return `<li class="${v.state === "paused" ? "paused" : ""}">
    <div class="top"><span class="num">${esc(v.n)}</span><span class="tt">${esc(v.title)}</span></div>
    <div class="dots" aria-label="Đang ở bước ${v.stage + 1}: ${esc(STEPS[v.stage]?.name)}">${dots}</div>
    <div class="note">${esc(v.note)}${links ? `<br>${links}` : ""}</div></li>`;
}
function renderOverview(){
  const active = VIDEOS.filter(v => v.state !== "done");
  const done = VIDEOS.filter(v => v.state === "done");
  info.innerHTML = `
    <span class="who">Tiến độ hiện tại</span>
    <h2>${active.length} video đang làm</h2>
    <p class="lead">${atStage(2).length + atStage(3).length ? `${atStage(2).length + atStage(3).length} video đang chờ bạn. ` : ""}Thanh màu cho biết video đang ở bước nào: xanh là xong, cam là bước hiện tại.</p>
    ${VIDEOS.length ? `<ul class="vlist">${active.map(videoItem).join("")}</ul>` : `<p class="empty">Chưa có video nào. Khi Claude bắt đầu một đợt mới, video sẽ hiện ở đây.</p>`}
    ${done.length ? `<h3>Đã xong</h3><ul class="vlist">${done.map(videoItem).join("")}</ul>` : ""}`;
}
function renderStation(i){
  const s = STEPS[i], owner = s.who === "owner";
  const here = VIDEOS.filter(v => v.stage === i);
  info.innerHTML = `
    <button class="back" id="back">← Tiến độ</button><br>
    <span class="who ${owner ? "owner" : ""}">Bước ${i+1}/${N} · ${owner ? "Bạn làm" : "Claude làm"}</span>
    <h2>${s.name}</h2>
    <p class="lead">${s.lead}</p>
    <dl>
      <div><dt>Việc làm</dt><dd>${s.does}</dd></div>
      <div><dt>Nhận vào</dt><dd>${s.input}</dd></div>
      <div><dt>Giao ra</dt><dd>${s.output}${s.parts ? `<div class="parts">${s.parts.map(p => `<span>${p}</span>`).join("")}</div>` : ""}</dd></div>
    </dl>
    <h3>Đang ở trạm này</h3>
    ${here.length ? `<ul class="vlist">${here.map(videoItem).join("")}</ul>` : `<p class="empty">Không có video nào ở trạm này lúc này.</p>`}`;
  document.getElementById("back").addEventListener("click", () => { view = "overview"; renderPanel(); pins.forEach(p => p.classList.remove("on")); railBtns.forEach(b => b.removeAttribute("aria-current")); });
}
function renderPanel(){ view === "overview" ? renderOverview() : renderStation(current); }
function renderBadges(){
  STEPS.forEach((s, i) => {
    const n = (i === 5 ? VIDEOS.filter(v => v.state === "done") : atStage(i)).length;
    pins[i].querySelector(".count").textContent = n ? String(n) : "";
    const paused = VIDEOS.filter(v => v.stage === i && v.state === "paused").length;
    const text = n ? WAITING[i].replace("{n}", n) : paused ? `${paused} video tạm dừng` : (s.idle || "");
    bubbles[i].textContent = text; bubbles[i].hidden = !text;
  });
}
function renderLog(){
  const tb = document.getElementById("logRows");
  if (!LOG.length) { tb.innerHTML = `<tr><td colspan="3" class="empty">Nhật ký sẽ hiện ở đây khi Claude làm xong từng việc.</td></tr>`; return; }
  tb.innerHTML = LOG.map(r => `<tr><td>${esc(r.date)}</td><td>${esc(r.agent)}</td><td>${esc(r.text)}</td></tr>`).join("");
}
function renderAll(){ renderBadges(); renderPanel(); renderLog(); }
document.getElementById("logToggle").addEventListener("click", e => {
  const box = document.getElementById("log"), closed = box.classList.toggle("closed");
  e.currentTarget.textContent = closed ? "Mở" : "Thu gọn"; e.currentTarget.setAttribute("aria-expanded", String(!closed));
});
if (innerWidth < 760) document.getElementById("logToggle").click();
(async () => {
  const live = document.getElementById("live");
  const db = window.claude?.use ? await window.claude.use("db") : null;
  if (!db) { live.querySelector("span").textContent = "Không tải được tiến độ ở chế độ xem này"; return; }
  const ok = () => { live.classList.add("on"); live.querySelector("span").textContent = "Tiến độ cập nhật trực tiếp"; };
  const fail = () => { live.classList.remove("on"); live.querySelector("span").textContent = "Mất kết nối tiến độ, tải lại trang để thử lại"; };
  db.collection("videos").orderBy("n").onSnapshot(snap => {
    VIDEOS = snap.docs.map(d => ({...d.data(), stage: Math.max(0, Math.min(5, Number(d.data().stage) || 0))}));
    ok(); renderAll();
  }, fail);
  db.collection("log").orderBy("ts", "desc").limit(60).onSnapshot(snap => {
    LOG = snap.docs.map(d => d.data()); renderLog();
  }, fail);
})();
STEPS.forEach((s, i) => {
  if (i) { const a = document.createElement("span"); a.className = "arrow"; a.textContent = "›"; a.setAttribute("aria-hidden","true"); rail.appendChild(a); }
  const b = document.createElement("button");
  b.className = s.who === "owner" ? "owner" : ""; b.innerHTML = `<b>${i+1}</b>${s.name}`;
  b.addEventListener("click", () => select(i, true)); rail.appendChild(b);
});
const railBtns = [...rail.querySelectorAll("button")];

let current = 0, fromStep = 0, travel = 1, autoplay = false, lastSwitch = 0;
const camGoal = {t: null};
function select(i, user){
  if (user) { autoplay = false; document.getElementById("play").setAttribute("aria-pressed", "false"); }
  fromStep = current; current = i; travel = 0; lastSwitch = performance.now();
  pins.forEach((p, k) => p.classList.toggle("on", k === i));
  railBtns.forEach((b, k) => k === i ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current"));
  railBtns[i].scrollIntoView({block:"nearest", inline:"center", behavior: reduce ? "auto" : "smooth"});
  view = "station"; renderStation(i);
  const p = posOf(i, 1);
  camGoal.t = new THREE.Vector3(p.x*2.5, 1, p.z*2.5);
}
document.getElementById("play").addEventListener("click", e => {
  autoplay = !autoplay; e.currentTarget.setAttribute("aria-pressed", String(autoplay)); lastSwitch = performance.now();
});
document.getElementById("spin").addEventListener("click", e => {
  controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = .6;
  e.currentTarget.setAttribute("aria-pressed", String(controls.autoRotate));
});

// click on a building
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(stations.map(s => s.hit))[0];
  if (hit) select(hit.object.userData.step, true);
});

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  camera.fov = w < 760 ? 50 : 38;
  // keep the island clear of the info card: shift the view left on wide screens, up on phones
  if (w >= 760) camera.setViewOffset(w, h, 180, 0, w, h);
  else camera.setViewOffset(w, h, 0, h*.16, w, h);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

// ---------- loop ----------
const tmp = new THREE.Vector3(), clock = new THREE.Clock();
function angleOnRing(i){ return Math.atan2(posOf(i).z, posOf(i).x); }
function tick(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (autoplay && performance.now() - lastSwitch > 4200) select((current+1) % N, false);
  if (camGoal.t) controls.target.lerp(camGoal.t, reduce ? 1 : .04);
  controls.update();

  if (!reduce){
    stations.forEach(s => {
      const u = s.group.userData;
      if (u.spinner) u.spinner.rotation[u.spinAxis || "y"] += dt * 1.2;
      if (u.bobber) u.bobber.position.y += Math.sin(t*3) * .004;
      if (u.floater) u.floater.position.y = 3.3 + Math.sin(t*1.6) * .15;
      if (u.riser) u.riser.position.y = 1.2 + ((t*.8) % 1) * 1.2;
      if (u.clap) u.clap.rotation.z = Math.max(0, Math.sin(t*4)) * .4;
      if (u.confetti) u.confetti.children.forEach(c => { c.position.y -= dt*c.userData.v; c.rotation.x += dt*3; if (c.position.y < .6) c.position.y = 4.6; });
    });
    walkers.forEach(w => {
      w.a += dt * w.sp; const x = Math.cos(w.a)*(R-.05), z = Math.sin(w.a)*(R-.05);
      w.o.position.set(x, .55 + Math.abs(Math.sin(t*8 + w.a*10))*.08, z); w.o.rotation.y = -w.a;
    });
    trees.forEach((tr, k) => tr.rotation.z = Math.sin(t*1.2 + k) * .02);
  }
  // courier carries the parcel from the previous station to the current one along the ring
  travel = Math.min(1, travel + dt / (reduce ? .001 : 2.2));
  let a0 = angleOnRing(fromStep), a1 = angleOnRing(current);
  let d = a1 - a0; while (d > 0) d -= Math.PI*2; if (fromStep === current) d = 0;
  const e = travel < .5 ? 2*travel*travel : 1 - Math.pow(-2*travel+2, 2)/2;
  const ac = a0 + d*e;
  courier.position.set(Math.cos(ac)*(R+.9), .55 + (travel < 1 ? Math.abs(Math.sin(t*10))*.12 : 0), Math.sin(ac)*(R+.9));
  courier.rotation.y = -ac + Math.PI;
  parcel.rotation.y += dt;

  renderer.render(scene, camera);
  const w = innerWidth, h = innerHeight;
  stations.forEach((s, i) => {
    tmp.copy(s.top).project(camera);
    const vis = tmp.z < 1;
    pins[i].style.display = vis ? "" : "none";
    pins[i].style.left = bubbles[i].style.left = ((tmp.x+1)/2*w) + "px";
    pins[i].style.top = bubbles[i].style.top = ((1-tmp.y)/2*h) + "px";
    bubbles[i].style.visibility = vis ? "" : "hidden";
  });
  requestAnimationFrame(tick);
}
renderAll();
requestAnimationFrame(tick);
</script>
